name: Deploy site
on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to Nginx
        run: |
          rsync -a --delete dist/shadeisroot-web/browser/ /var/www/shadeisroot/
          sudo systemctl reload nginx